name: DSH Native Dify Provider E2E

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  dsh-native-provider-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        dsh-version:
          - 0.1.0-rc.7
          - 0.1.0-rc.8
          - 0.1.3-alpha.1
    env:
      DSH_VERSION: ${{ matrix.dsh-version }}
      DSH_HOME: /tmp/dsh-native-dify-home
      DSH_PERMISSION_MODE: danger-full-access
      DIFY_PROVIDER_ID: dify
      DIFY_APP_ID: default
      DIFY_MODEL_NAME: Dify Native E2E
      DIFY_API_URL: http://127.0.0.1:39125
      DIFY_API_KEY: test-key
      DIFY_TIMEOUT: '120000'
      DIFY_CONTEXT_WINDOW: '32768'
      DIFY_TELEMETRY_STDOUT: '1'
      FAKE_DIFY_NATIVE_PORT: '39125'
      FAKE_DIFY_NATIVE_OUTPUT: /tmp/fake-dify-native-requests.json
      FAKE_DIFY_NATIVE_UPLOAD_OUTPUT: /tmp/fake-dify-native-uploads.json
      FAKE_DIFY_NATIVE_IMAGE_E2E: '1'
      FAKE_DIFY_NATIVE_IMAGE_PATH: ${{ github.workspace }}/dsh-native-read-image.png
      DSH_WORKSPACE_ROOT: ${{ github.workspace }}
      CI: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout synchronized DSH source
        if: matrix.dsh-version == '0.1.3-alpha.1'
        uses: actions/checkout@v4
        with:
          repository: zinianly-aide/deepseek-harness
          ref: 14028dac4539df720b6f852e7f88e57e6badb3fe
          path: .dsh-latest

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install published DSH and pnpm
        if: matrix.dsh-version != '0.1.3-alpha.1'
        run: npm install -g pnpm@10 "@deepseek-ai/dsh@${DSH_VERSION}"

      - name: Build synchronized DSH source
        if: matrix.dsh-version == '0.1.3-alpha.1'
        shell: bash
        run: |
          npm install -g pnpm@11.7.0
          cd "$GITHUB_WORKSPACE/.dsh-latest"
          pnpm install --frozen-lockfile
          pnpm run build
          mkdir -p "$RUNNER_TEMP/dsh-source-bin"
          cat > "$RUNNER_TEMP/dsh-source-bin/dsh" <<EOF
          #!/usr/bin/env bash
          exec node "$GITHUB_WORKSPACE/.dsh-latest/apps/cli/lib/bin.js" "\$@"
          EOF
          chmod +x "$RUNNER_TEMP/dsh-source-bin/dsh"
          echo "$RUNNER_TEMP/dsh-source-bin" >> "$GITHUB_PATH"

      - name: Install matrix-matched native provider development dependencies
        if: matrix.dsh-version != '0.1.3-alpha.1'
        shell: bash
        run: |
          cd packages/dsh-dify-provider
          pnpm install --no-frozen-lockfile
          pnpm add -D "@deepseek-ai/dsh-credentials@${DSH_VERSION}" "@deepseek-ai/dsh-llm@${DSH_VERSION}"

      - name: Link synchronized DSH provider development dependencies
        if: matrix.dsh-version == '0.1.3-alpha.1'
        shell: bash
        run: |
          cd packages/dsh-dify-provider
          pnpm install --no-frozen-lockfile --config.auto-install-peers=false
          mkdir -p node_modules/@deepseek-ai
          ln -sfn "$GITHUB_WORKSPACE/.dsh-latest/packages/credentials/credentials" node_modules/@deepseek-ai/dsh-credentials
          ln -sfn "$GITHUB_WORKSPACE/.dsh-latest/packages/llm/llm" node_modules/@deepseek-ai/dsh-llm

      - name: Run read_image bridge unit tests
        shell: bash
        run: node --test packages/dsh-dify-provider/test/read-image-bridge.test.js

      - name: Initialize headless profile
        run: dsh --profile headless --dump-config > /tmp/dsh-native-base-config.txt

      - name: Install native Dify provider from checkout
        shell: bash
        run: |
          timeout 180s dsh plugin --profile headless add "$GITHUB_WORKSPACE/packages/dsh-dify-provider" --reporter=append-only
          dsh plugin --profile headless why dsh-dify-provider --reporter=append-only

      - name: Select native Dify provider
        shell: bash
        run: |
          mkdir -p "$DSH_HOME"
          cat > "$DSH_HOME/settings.yaml" <<'YAML'
          agent-default-model:
            provider: dify
            model: default
          YAML
          dsh --profile headless --dump-config > /tmp/dsh-native-config.txt
          grep -q "dsh-dify-provider" /tmp/dsh-native-config.txt

      - name: Create real image fixture
        shell: bash
        run: |
          printf '%s' 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9Y9ZQtMAAAAASUVORK5CYII=' | base64 --decode > "$FAKE_DIFY_NATIVE_IMAGE_PATH"
          test -s "$FAKE_DIFY_NATIVE_IMAGE_PATH"
          file "$FAKE_DIFY_NATIVE_IMAGE_PATH"

      - name: Start Fake Dify
        shell: bash
        run: |
          node scripts/fake-dify-native-provider.mjs > /tmp/fake-dify-native.log 2>&1 &
          echo $! > /tmp/fake-dify-native.pid
          for i in $(seq 1 30); do
            if grep -q "FAKE_DIFY_NATIVE_READY" /tmp/fake-dify-native.log; then exit 0; fi
            sleep 1
          done
          cat /tmp/fake-dify-native.log || true
          exit 1

      - name: Invoke native provider from real DSH headless
        shell: bash
        run: |
          set +e
          output=$(timeout 120s dsh --profile headless "Return the provider response. If a tool is requested, execute it and continue." 2>&1)
          code=$?
          set -e
          printf '%s\n' "$output" | tee /tmp/dsh-native-output.log
          if [ "$code" -ne 0 ]; then
            cat /tmp/fake-dify-native.log || true
            exit "$code"
          fi
          echo "$output" | grep -q "DSH_NATIVE_PROVIDER_OK"

      - name: Verify emitted read_image descriptor bridge
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const output = fs.readFileSync('/tmp/dsh-native-output.log', 'utf8');
          const events = [];
          for (const line of output.split(/\r?\n/)) {
            const start = line.indexOf('{');
            if (start < 0) continue;
            try {
              const parsed = JSON.parse(line.slice(start));
              if (parsed.component === 'dify-tool-attachment-bridge') events.push(parsed);
            } catch {}
          }
          const ownership = events.find((event) => event.event === 'tool-call-ownership' && event.toolName === 'read_image');
          if (!ownership?.registered) throw new Error('real DSH read_image ownership was not registered');
          const descriptor = events.find((event) => event.event === 'attachment_resolved' && event.resolved === true);
          if (!descriptor) throw new Error('emitted read_image did not register a safe descriptor');
          if (!descriptor.sessionHash || !descriptor.toolCallIdHash) throw new Error('descriptor diagnostics lost session/tool call correlation');
          if (JSON.stringify(events).includes(process.env.FAKE_DIFY_NATIVE_IMAGE_PATH)) throw new Error('attachment telemetry leaked the real local path');
          console.log(JSON.stringify({
            result: 'PASS',
            dshVersion: process.env.DSH_VERSION,
            emittedReadImage: true,
            ownershipRegistered: true,
            descriptorRegistered: true,
          }, null, 2));
          NODE

      - name: Verify rc.8 text-only isError regression shape
        if: matrix.dsh-version == '0.1.0-rc.8'
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const output = fs.readFileSync('/tmp/dsh-native-output.log', 'utf8');
          const events = [];
          for (const line of output.split(/\r?\n/)) {
            const start = line.indexOf('{');
            if (start < 0) continue;
            try {
              const parsed = JSON.parse(line.slice(start));
              if (parsed.component === 'dify-tool-attachment-bridge') events.push(parsed);
            } catch {}
          }
          const result = events.find((event) => event.event === 'tools/result' && event.toolName === 'read_image');
          if (!result) throw new Error('missing rc.8 read_image tools/result diagnostic');
          if (result.isError !== true) throw new Error('rc.8 regression no longer reproduced isError=true');
          if (!Array.isArray(result.contentBlockTypes) || result.contentBlockTypes.length !== 1 || result.contentBlockTypes[0] !== 'text') {
            throw new Error(`rc.8 expected text-only result, got ${JSON.stringify(result.contentBlockTypes)}`);
          }
          if (result.imageBlockCount !== 0) throw new Error(`rc.8 expected no image block, got ${result.imageBlockCount}`);
          if (result.captured !== false) throw new Error('rc.8 expected result-stage capture=false');
          const descriptor = events.find((event) => event.event === 'attachment_resolved' && event.resolved === true);
          if (!descriptor) throw new Error('rc.8 text-only result lost emitted-call descriptor');
          console.log(JSON.stringify({
            result: 'PASS',
            dshVersion: process.env.DSH_VERSION,
            isError: true,
            textOnly: true,
            imageBlockCount: 0,
            captured: false,
            descriptorPreserved: true,
          }, null, 2));
          NODE

      - name: Verify Session to Conversation continuity
        shell: bash
        run: |
          test -s "$FAKE_DIFY_NATIVE_OUTPUT"
          node - <<'NODE'
          const fs = require('fs');
          const requests = JSON.parse(fs.readFileSync(process.env.FAKE_DIFY_NATIVE_OUTPUT, 'utf8'));
          const bootstrap = requests.find((r) => r.hasToolSchema && !r.hasToolResult);
          const continuation = requests.find((r) => r.hasToolResult);
          if (!bootstrap) throw new Error('missing main BOOTSTRAP request');
          if (!continuation) throw new Error('missing TOOL_CONTINUE request');
          if ((bootstrap.body.conversation_id || '') !== '') throw new Error('BOOTSTRAP must start with empty conversation_id');
          if (continuation.body.conversation_id !== bootstrap.assignedConversationId) {
            throw new Error(`TOOL_CONTINUE did not reuse ${bootstrap.assignedConversationId}: ${continuation.body.conversation_id}`);
          }
          if (continuation.sessionHashUser !== bootstrap.sessionHashUser) throw new Error('DSH Session hash changed across main rounds');
          if (!/call_native_001/.test(continuation.body.query || '')) throw new Error('tool result continuation lost tool_call_id');
          if (!(continuation.toolResultPayloadLength > 0)) throw new Error('correlated tool result payload was empty');
          if (continuation.hasToolSchema) throw new Error('unchanged tool schema was resent after auxiliary call');
          const auxiliaries = requests.filter((r) => r !== bootstrap && r !== continuation);
          if (auxiliaries.some((r) => (r.body.conversation_id || '') !== '')) {
            throw new Error('auxiliary DSH calls must not reuse the main Dify conversation');
          }
          if (bootstrap.headers.authorization !== '***') throw new Error('native provider did not use configured Dify credential');
          console.log(JSON.stringify({
            result: 'PASS',
            dshVersion: process.env.DSH_VERSION,
            requestCount: requests.length,
            sessionHashUser: bootstrap.sessionHashUser,
            bootstrapConversationIdIn: bootstrap.body.conversation_id || '',
            bootstrapConversationIdOut: bootstrap.assignedConversationId,
            continuationConversationIdIn: continuation.body.conversation_id,
            auxiliaryRequestCount: auxiliaries.length,
            auxiliaryIsolated: true,
            toolResultCorrelated: true,
            toolResultPayloadLength: continuation.toolResultPayloadLength,
            toolSchemaReused: true,
          }, null, 2));
          NODE

      - name: Verify real DSH read_image upload
        shell: bash
        run: |
          test -s "$FAKE_DIFY_NATIVE_UPLOAD_OUTPUT"
          node - <<'NODE'
          const fs = require('fs');
          const requests = JSON.parse(fs.readFileSync(process.env.FAKE_DIFY_NATIVE_OUTPUT, 'utf8'));
          const uploads = JSON.parse(fs.readFileSync(process.env.FAKE_DIFY_NATIVE_UPLOAD_OUTPUT, 'utf8'));
          const bootstrap = requests.find((r) => r.hasToolSchema && !r.hasToolResult);
          const continuation = requests.find((r) => r.hasToolResult);
          if (!bootstrap || !continuation) throw new Error('missing native read_image lifecycle requests');
          if (uploads.length !== 1) throw new Error(`read_image should upload exactly once, got ${uploads.length}`);
          const upload = uploads[0];
          if (!upload.authorizationPresent) throw new Error('image upload did not use Dify credential');
          if (!/^multipart\/form-data;/i.test(upload.contentType || '')) throw new Error('image upload was not multipart/form-data');
          if (!upload.hasMultipartFile || !upload.hasMultipartUser) throw new Error('image upload multipart payload is incomplete');
          if (!(upload.contentLength > 0)) throw new Error('image upload body was empty');
          if (bootstrap.fileCount !== 0) throw new Error('BOOTSTRAP unexpectedly attached an image before read_image');
          if (continuation.fileCount !== 1) throw new Error(`TOOL_CONTINUE should carry one image, got ${continuation.fileCount}`);
          if (!Array.isArray(continuation.fileIds) || continuation.fileIds[0] !== upload.id) {
            throw new Error(`TOOL_CONTINUE did not reference uploaded image ${upload.id}`);
          }
          const file = continuation.body.files?.[0];
          if (file?.type !== 'image' || file?.transfer_method !== 'local_file' || file?.upload_file_id !== upload.id) {
            throw new Error('TOOL_CONTINUE did not use Dify local_file image protocol');
          }
          console.log(JSON.stringify({
            result: 'PASS',
            dshVersion: process.env.DSH_VERSION,
            realDshReadImage: true,
            uploadCount: uploads.length,
            uploadId: upload.id,
            bootstrapFileCount: bootstrap.fileCount,
            continuationConversationId: continuation.body.conversation_id,
            continuationFileCount: continuation.fileCount,
            duplicateImageUpload: false,
          }, null, 2));
          NODE

      - name: Verify native decision telemetry
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const output = fs.readFileSync('/tmp/dsh-native-output.log', 'utf8');
          const events = [];
          for (const line of output.split(/\r?\n/)) {
            const start = line.indexOf('{');
            if (start < 0) continue;
            try {
              const parsed = JSON.parse(line.slice(start));
              if (parsed.component === 'gateway-decision' && parsed.source === 'dsh-dify-provider') events.push(parsed);
            } catch {}
          }
          if (events.length < 2) throw new Error(`expected native decision events for main rounds, got ${events.length}`);
          const main = events.find((x) => x.telemetry?.toolCount > 0 && x.telemetry?.contextWindow === 32768);
          if (!main) throw new Error('missing main native decision event with context profile');
          if (main.event?.decision?.compression !== 'none') throw new Error('native policy unexpectedly compressed a low-utilization request');
          if (!Array.isArray(main.event?.decision?.reasonCodes) || !main.event.decision.reasonCodes.includes('client=dsh')) {
            throw new Error('native decision reasonCodes missing client=dsh');
          }
          if (!main.event.decision.reasonCodes.some((code) => code.startsWith('context_utilization='))) {
            throw new Error('native context utilization reasonCode missing');
          }
          if (!main.telemetry.sessionIdHash || main.telemetry.sessionIdHash.length !== 24) throw new Error('native session hash missing');
          if (!(main.telemetry.toolSchemaEstimatedTokens > 0)) throw new Error('native tool schema token estimate missing');
          if (main.telemetry.success !== true) throw new Error('native telemetry did not record success');
          if (output.includes('test-key')) throw new Error('native output leaked API key');
          if (output.includes('Return the provider response. If a tool is requested, execute it and continue.')) {
            throw new Error('native telemetry/output leaked complete task prompt');
          }
          console.log('REAL_NATIVE_DECISION_EVENT ' + JSON.stringify(main.event));
          console.log('REAL_NATIVE_TELEMETRY ' + JSON.stringify(main.telemetry));
          NODE

      - name: Show native provider logs
        if: always()
        shell: bash
        run: |
          echo '--- fake dify native ---'
          cat /tmp/fake-dify-native.log || true
          echo '--- fake dify native uploads ---'
          cat "$FAKE_DIFY_NATIVE_UPLOAD_OUTPUT" || true
          echo '--- dsh native output ---'
          cat /tmp/dsh-native-output.log || true
