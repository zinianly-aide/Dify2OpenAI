name: DSH Lifecycle CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Unit and fake-Dify HTTP E2E
        run: npm test

      - name: Preflight
        shell: bash
        run: |
          set +e
          npm run preflight
          code=$?
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then
            exit "$code"
          fi
          exit 0

      - name: Integration
        run: npm run test:integration

  dsh-plugin-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DSH_HOME: /tmp/dsh-home
      DSH_PROBE_PORT: '39123'
      DSH_PROBE_OUTPUT: /tmp/dsh-probe-request.json
      DIFY2OPENAI_E2E_KEY: test-key
      FAKE_DIFY_PORT: '39124'
      FAKE_DIFY_OUTPUT: /tmp/fake-dify-requests.json
      CI: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pinned DSH and pnpm
        run: npm install -g pnpm@10 @deepseek-ai/dsh@0.1.0-rc.7

      - name: Initialize headless profile
        run: dsh --profile headless --dump-config > /tmp/dsh-base-config.txt

      - name: Install DSH custom provider plugin into headless profile
        shell: bash
        run: |
          timeout 180s dsh plugin --profile headless add @linziyanleo/dsh-custom-provider@0.1.1 --reporter=append-only
          dsh plugin --profile headless why @linziyanleo/dsh-custom-provider --reporter=append-only

      - name: Configure direct OpenAI probe provider
        shell: bash
        run: |
          mkdir -p "$DSH_HOME"
          cat > "$DSH_HOME/settings.yaml" <<'YAML'
          llm-custom:
            providers:
              dify2openai-e2e:
                displayName: Dify2OpenAI E2E
                apiKeyEnv: DIFY2OPENAI_E2E_KEY
                api: openai-completions
                baseURL: http://127.0.0.1:39123/v1
                compat:
                  supportsStore: false
                  supportsDeveloperRole: false
                  supportsReasoningEffort: false
                  maxTokensField: max_tokens
                models:
                  - id: dify2openai-e2e
                    name: Dify2OpenAI E2E
                    contextWindow: 32768
                    maxTokens: 4096
                    reasoningEfforts: false
          agent-default-model:
            provider: dify2openai-e2e
            model: dify2openai-e2e
          YAML

      - name: Verify plugin is composed
        shell: bash
        run: |
          dsh --profile headless --dump-config > /tmp/dsh-config.txt
          grep -q "llm-custom" /tmp/dsh-config.txt
          grep -q "@linziyanleo/dsh-custom-provider" /tmp/dsh-config.txt

      - name: Start OpenAI-compatible probe
        shell: bash
        run: |
          node scripts/dsh-openai-probe.mjs > /tmp/dsh-probe.log 2>&1 &
          echo $! > /tmp/dsh-probe.pid
          for i in $(seq 1 30); do
            if grep -q "DSH_PROBE_READY" /tmp/dsh-probe.log; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/dsh-probe.log
          exit 1

      - name: Invoke provider from real DSH headless
        shell: bash
        run: |
          output=$(timeout 120s dsh --profile headless "Reply with the provider response and do not perform additional work." 2>&1)
          echo "$output"
          echo "$output" | grep -q "DSH_PLUGIN_E2E_OK"

      - name: Verify DSH OpenAI requests and inspect lifecycle identifiers
        shell: bash
        run: |
          test -s "$DSH_PROBE_OUTPUT"
          node - <<'NODE'
          const fs = require('fs');
          const requests = JSON.parse(fs.readFileSync(process.env.DSH_PROBE_OUTPUT, 'utf8'));
          const chatRequests = requests.filter((p) => p.url === '/v1/chat/completions');
          if (chatRequests.length === 0) throw new Error('DSH did not call /v1/chat/completions');
          const withTools = chatRequests.find((p) => Array.isArray(p.body.tools) && p.body.tools.length > 0);
          if (!withTools) throw new Error('DSH never sent tool schemas');
          const summaries = chatRequests.map((p, index) => ({
            index,
            userAgent: p.headers['user-agent'] || null,
            messageCount: Array.isArray(p.body.messages) ? p.body.messages.length : 0,
            toolCount: Array.isArray(p.body.tools) ? p.body.tools.length : 0,
            bodyKeys: Object.keys(p.body).sort(),
            candidateBodyFields: Object.fromEntries(Object.entries(p.body).filter(([k]) => /session|conversation|user|metadata|trace/i.test(k))),
            candidateHeaders: Object.fromEntries(Object.entries(p.headers).filter(([k]) => /session|conversation|dsh|request|trace/i.test(k))),
          }));
          console.log(JSON.stringify({ result: 'PASS', requestCount: chatRequests.length, summaries }, null, 2));
          NODE

      - name: Install gateway dependencies
        run: npm install --no-audit --no-fund

      - name: Reconfigure DSH to call Dify2OpenAI gateway
        shell: bash
        run: |
          kill "$(cat /tmp/dsh-probe.pid)" || true
          cat > "$DSH_HOME/settings.yaml" <<'YAML'
          llm-custom:
            providers:
              dify2openai-gateway-e2e:
                displayName: Dify2OpenAI Gateway E2E
                apiKeyEnv: DIFY2OPENAI_E2E_KEY
                api: openai-completions
                baseURL: http://127.0.0.1:3099/v1
                compat:
                  supportsStore: false
                  supportsDeveloperRole: false
                  supportsReasoningEffort: false
                  maxTokensField: max_tokens
                models:
                  - id: dify
                    name: Dify2OpenAI Gateway E2E
                    contextWindow: 32768
                    maxTokens: 4096
                    reasoningEfforts: false
          agent-default-model:
            provider: dify2openai-gateway-e2e
            model: dify
          YAML
          dsh --profile headless --dump-config > /tmp/dsh-gateway-config.txt
          grep -q "dify2openai-gateway-e2e" /tmp/dsh-gateway-config.txt
          echo 'DIFY2OPENAI_E2E_KEY=http://127.0.0.1:39124|test-key|Chat' >> "$GITHUB_ENV"

      - name: Start Fake Dify and Dify2OpenAI gateway
        shell: bash
        run: |
          node scripts/fake-dify-e2e.mjs > /tmp/fake-dify.log 2>&1 &
          echo $! > /tmp/fake-dify.pid
          PORT=3099 NODE_ENV=production node app.js > /tmp/dify2openai.log 2>&1 &
          echo $! > /tmp/dify2openai.pid
          for i in $(seq 1 30); do
            if grep -q "FAKE_DIFY_READY" /tmp/fake-dify.log && curl -fsS http://127.0.0.1:3099/capabilities >/tmp/capabilities.json; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/fake-dify.log || true
          cat /tmp/dify2openai.log || true
          exit 1

      - name: Invoke Dify2OpenAI from real DSH
        shell: bash
        run: |
          set +e
          output=$(timeout 120s dsh --profile headless "Return the provider response and do not perform additional work." 2>&1)
          code=$?
          set -e
          echo "$output"
          if [ "$code" -ne 0 ]; then
            cat /tmp/fake-dify.log || true
            cat /tmp/dify2openai.log || true
            exit "$code"
          fi
          echo "$output" | grep -q "DSH_GATEWAY_E2E_OK"

      - name: Verify DSH reached Fake Dify through gateway
        shell: bash
        run: |
          test -s "$FAKE_DIFY_OUTPUT"
          node - <<'NODE'
          const fs = require('fs');
          const requests = JSON.parse(fs.readFileSync(process.env.FAKE_DIFY_OUTPUT, 'utf8'));
          if (!Array.isArray(requests) || requests.length === 0) throw new Error('gateway never called Fake Dify');
          if (!requests.every((r) => r.url === '/chat-messages')) throw new Error('unexpected Fake Dify path');
          const first = requests[0];
          if (first.headers.authorization !== 'Bearer test-key') throw new Error('gateway did not forward Dify credential');
          if (typeof first.body.query !== 'string' || first.body.query.length === 0) throw new Error('gateway did not build Dify query');
          console.log(JSON.stringify({
            result: 'PASS',
            requestCount: requests.length,
            firstConversationIdIn: first.body.conversation_id || '',
            firstConversationIdOut: first.assignedConversationId,
            laterConversationIdsIn: requests.slice(1).map((r) => r.body.conversation_id || ''),
            queryLength: first.body.query.length,
            responseMode: first.body.response_mode,
          }, null, 2));
          NODE

      - name: Show DSH E2E logs
        if: always()
        shell: bash
        run: |
          echo '--- probe ---'
          cat /tmp/dsh-probe.log || true
          echo '--- fake dify ---'
          cat /tmp/fake-dify.log || true
          echo '--- gateway ---'
          tail -n 200 /tmp/dify2openai.log || true
