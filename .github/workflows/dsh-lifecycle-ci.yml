name: DSH Lifecycle CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Unit and fake-Dify HTTP E2E
        run: npm test

      - name: Preflight
        shell: bash
        run: |
          set +e
          npm run preflight
          code=$?
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then
            exit "$code"
          fi
          exit 0

      - name: Integration
        run: npm run test:integration
