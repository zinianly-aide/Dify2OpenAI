name: DSH Lifecycle CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Unit and fake-Dify HTTP E2E
        run: npm test

      - name: Preflight
        shell: bash
        run: |
          set +e
          npm run preflight
          code=$?
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then
            exit "$code"
          fi
          exit 0

      - name: Integration
        run: npm run test:integration

  dsh-plugin-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DSH_HOME: /tmp/dsh-home
      DSH_PROBE_PORT: '39123'
      DSH_PROBE_OUTPUT: /tmp/dsh-probe-request.json
      DIFY2OPENAI_E2E_KEY: test-key
      CI: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pinned DSH and pnpm
        run: npm install -g pnpm@10 @deepseek-ai/dsh@0.1.0-rc.7

      - name: Initialize headless profile
        run: dsh --profile headless --dump-config > /tmp/dsh-base-config.txt

      - name: Install DSH custom provider plugin into headless profile
        shell: bash
        run: |
          timeout 180s dsh plugin --profile headless add @linziyanleo/dsh-custom-provider@0.1.1 --reporter=append-only
          dsh plugin --profile headless why @linziyanleo/dsh-custom-provider --reporter=append-only

      - name: Configure Dify2OpenAI as OpenAI-compatible provider
        shell: bash
        run: |
          mkdir -p "$DSH_HOME"
          cat > "$DSH_HOME/settings.yaml" <<'YAML'
          llm-custom:
            providers:
              dify2openai-e2e:
                displayName: Dify2OpenAI E2E
                apiKeyEnv: DIFY2OPENAI_E2E_KEY
                api: openai-completions
                baseURL: http://127.0.0.1:39123/v1
                compat:
                  supportsStore: false
                  supportsDeveloperRole: false
                  supportsReasoningEffort: false
                  maxTokensField: max_tokens
                models:
                  - id: dify2openai-e2e
                    name: Dify2OpenAI E2E
                    contextWindow: 32768
                    maxTokens: 4096
                    reasoningEfforts: false
          agent-default-model:
            provider: dify2openai-e2e
            model: dify2openai-e2e
          YAML

      - name: Verify plugin is composed
        shell: bash
        run: |
          dsh --profile headless --dump-config > /tmp/dsh-config.txt
          grep -q "llm-custom" /tmp/dsh-config.txt
          grep -q "@linziyanleo/dsh-custom-provider" /tmp/dsh-config.txt

      - name: Start OpenAI-compatible probe
        shell: bash
        run: |
          node scripts/dsh-openai-probe.mjs > /tmp/dsh-probe.log 2>&1 &
          echo $! > /tmp/dsh-probe.pid
          for i in $(seq 1 30); do
            if grep -q "DSH_PROBE_READY" /tmp/dsh-probe.log; then
              cat /tmp/dsh-probe.log
              exit 0
            fi
            sleep 1
          done
          cat /tmp/dsh-probe.log
          exit 1

      - name: Invoke provider from real DSH headless
        shell: bash
        run: |
          set +e
          output=$(timeout 120s dsh --profile headless "Reply with the provider response and do not perform additional work." 2>&1)
          code=$?
          set -e
          echo "$output"
          if [ "$code" -ne 0 ]; then
            cat /tmp/dsh-probe.log || true
            exit "$code"
          fi
          echo "$output" | grep -q "DSH_PLUGIN_E2E_OK"

      - name: Verify DSH request reached OpenAI Chat Completions with tools
        shell: bash
        run: |
          test -s "$DSH_PROBE_OUTPUT"
          node - <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync(process.env.DSH_PROBE_OUTPUT, 'utf8'));
          if (p.url !== '/v1/chat/completions') throw new Error(`unexpected path: ${p.url}`);
          if (!Array.isArray(p.body.messages) || p.body.messages.length === 0) throw new Error('DSH did not send messages');
          if (!Array.isArray(p.body.tools) || p.body.tools.length === 0) throw new Error('DSH did not send tool schemas');
          console.log(JSON.stringify({
            result: 'PASS',
            url: p.url,
            userAgent: p.headers['user-agent'] || null,
            messageCount: p.body.messages.length,
            toolCount: p.body.tools.length,
            bodyKeys: Object.keys(p.body).sort(),
            possibleConversationFields: Object.fromEntries(Object.entries(p.body).filter(([k]) => /session|conversation|user|metadata/i.test(k))),
            possibleConversationHeaders: Object.fromEntries(Object.entries(p.headers).filter(([k]) => /session|conversation|dsh|request|trace/i.test(k))),
          }, null, 2));
          NODE

      - name: Show probe log
        if: always()
        run: cat /tmp/dsh-probe.log || true
