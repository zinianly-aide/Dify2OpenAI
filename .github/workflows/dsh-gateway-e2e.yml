name: DSH Gateway E2E

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  dsh-gateway-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DSH_HOME: /tmp/dsh-gateway-home
      DIFY2OPENAI_GATEWAY_KEY: 'http://127.0.0.1:39124|test-key|Chat'
      FAKE_DIFY_PORT: '39124'
      FAKE_DIFY_OUTPUT: /tmp/fake-dify-requests.json
      CI: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install gateway dependencies
        run: npm install --no-audit --no-fund

      - name: Install pinned DSH and pnpm
        run: npm install -g pnpm@10 @deepseek-ai/dsh@0.1.0-rc.7

      - name: Initialize DSH and install custom provider
        shell: bash
        run: |
          dsh --profile headless --dump-config > /tmp/dsh-base-config.txt
          timeout 180s dsh plugin --profile headless add @linziyanleo/dsh-custom-provider@0.1.1 --reporter=append-only
          dsh plugin --profile headless why @linziyanleo/dsh-custom-provider --reporter=append-only

      - name: Configure Dify2OpenAI provider from clean DSH home
        shell: bash
        run: |
          mkdir -p "$DSH_HOME"
          cat > "$DSH_HOME/settings.yaml" <<'YAML'
          llm-custom:
            providers:
              gateway-e2e:
                displayName: Dify2OpenAI Gateway E2E
                apiKeyEnv: DIFY2OPENAI_GATEWAY_KEY
                api: openai-completions
                baseURL: http://127.0.0.1:3099/v1
                compat:
                  supportsStore: false
                  supportsDeveloperRole: false
                  supportsReasoningEffort: false
                  maxTokensField: max_tokens
                models:
                  - id: gateway-e2e-model
                    name: Dify2OpenAI Gateway E2E
                    contextWindow: 32768
                    maxTokens: 4096
                    reasoningEfforts: false
          agent-default-model:
            provider: gateway-e2e
            model: gateway-e2e-model
          YAML
          dsh --profile headless --dump-config > /tmp/dsh-gateway-config.txt
          grep -q "gateway-e2e" /tmp/dsh-gateway-config.txt
          grep -q "@linziyanleo/dsh-custom-provider" /tmp/dsh-gateway-config.txt

      - name: Start Fake Dify and Dify2OpenAI
        shell: bash
        run: |
          node scripts/fake-dify-e2e.mjs > /tmp/fake-dify.log 2>&1 &
          echo $! > /tmp/fake-dify.pid
          PORT=3099 NODE_ENV=production node app.js > /tmp/dify2openai.log 2>&1 &
          echo $! > /tmp/dify2openai.pid
          for i in $(seq 1 30); do
            if grep -q "FAKE_DIFY_READY" /tmp/fake-dify.log && curl -fsS http://127.0.0.1:3099/capabilities >/tmp/capabilities.json; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/fake-dify.log || true
          cat /tmp/dify2openai.log || true
          exit 1

      - name: Invoke Dify2OpenAI from real DSH headless
        shell: bash
        run: |
          set +e
          output=$(timeout 120s dsh --profile headless "Return the provider response and do not perform additional work." 2>&1)
          code=$?
          set -e
          echo "$output"
          if [ "$code" -ne 0 ]; then
            cat /tmp/fake-dify.log || true
            cat /tmp/dify2openai.log || true
            exit "$code"
          fi
          echo "$output" | grep -q "DSH_GATEWAY_E2E_OK"

      - name: Verify gateway actually called Dify
        shell: bash
        run: |
          test -s "$FAKE_DIFY_OUTPUT"
          node - <<'NODE'
          const fs = require('fs');
          const requests = JSON.parse(fs.readFileSync(process.env.FAKE_DIFY_OUTPUT, 'utf8'));
          if (!Array.isArray(requests) || requests.length === 0) throw new Error('gateway never called Fake Dify');
          const first = requests[0];
          if (first.url !== '/chat-messages') throw new Error(`unexpected path ${first.url}`);
          if (first.headers.authorization !== 'Bearer test-key') throw new Error('gateway did not forward the decoded Dify key');
          if (!first.body || typeof first.body.query !== 'string' || first.body.query.length === 0) throw new Error('gateway did not build a Dify query');
          console.log(JSON.stringify({
            result: 'PASS',
            requestCount: requests.length,
            firstConversationIdIn: first.body.conversation_id || '',
            firstConversationIdOut: first.assignedConversationId,
            laterConversationIdsIn: requests.slice(1).map((r) => r.body.conversation_id || ''),
            responseMode: first.body.response_mode,
            queryLength: first.body.query.length,
          }, null, 2));
          NODE

      - name: Show gateway E2E logs
        if: always()
        shell: bash
        run: |
          echo '--- fake dify ---'
          cat /tmp/fake-dify.log || true
          echo '--- gateway ---'
          tail -n 200 /tmp/dify2openai.log || true
