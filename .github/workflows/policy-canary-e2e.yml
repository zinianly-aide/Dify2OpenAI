name: Policy Canary Lifecycle E2E

on:
  push:
    branches: [main]
  pull_request:

jobs:
  policy-canary-e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run policy registry canary guardrail promotion rollback tests
        run: node --test tests/policy-canary.test.js tests/offline-policy.test.js tests/backend-routing.test.js tests/tool-optimization.test.js
